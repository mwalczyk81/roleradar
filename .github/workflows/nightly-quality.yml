name: Nightly quality

# Mutation testing for the web pure-logic library (StrykerJS, Vitest runner), run nightly and on manual dispatch.
# It never runs on pushes or on ordinary pull requests. The one pull request trigger is a validation run that fires
# only when this file itself changes, only for pull requests from this repository, publishes nothing and receives no
# secret. web/tests/tooling/workflow-triggers.test.ts fails if this trigger block or the secret guards drift.
#
# .NET mutation testing (Domain, Application) is deferred: Stryker.NET does not work with xUnit v3 on this stack.
# See specs/011-test-quality-reporting/research.md D1 for the evidence and the revisit trigger.
#
# Time budget: each job's timeout-minutes is its budget. If a job nears it, cut scope in this order (research.md D4):
# narrow `mutate` in web/stryker.config.mjs, lower the mutation level, sample mutants, shard by file group.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nightly-quality.yml'

permissions: {}

concurrency:
  group: nightly-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation-web:
    name: Mutation testing (web lib)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # First-run ceiling from the local measurements in research.md D5 (about 35 minutes of mutation on 4 workers plus
    # install). The validation run's measured duration replaces it (task T022).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A non-secret boolean. Only the presence of the key is recorded; its value is never printed. This step and the
      # publish step below are the only places the secret is referenced, and neither runs on a pull request.
      - name: Check whether the dashboard key is configured
        id: key
        if: github.event_name != 'pull_request'
        env:
          KEY_PRESENT: ${{ secrets.STRYKER_DASHBOARD_API_KEY != '' }}
        run: echo "present=${KEY_PRESENT}" >> "$GITHUB_OUTPUT"

      - name: Run StrykerJS (web/app/lib)
        run: pnpm --filter web run mutation

      # Uploads the finished JSON report. The key reaches only this step, which runs no repository code.
      # A rejected key is reported but does not fail the job (the score check below stands on its own).
      - name: Publish report to the Stryker Dashboard
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
          KEY_PRESENT: ${{ steps.key.outputs.present }}
          DASHBOARD_PROJECT: github.com/${{ github.repository }}
          DASHBOARD_VERSION: ${{ github.ref_name }}
        run: |
          if [ "${KEY_PRESENT}" != "true" ]; then
            echo "Dashboard publish skipped: secret not configured."
            exit 0
          fi
          if [ ! -f web/reports/mutation/mutation.json ]; then
            echo "::warning::No mutation report to publish."
            exit 0
          fi
          if curl --silent --show-error --fail --max-time 120 -X PUT \
            "https://dashboard.stryker-mutator.io/api/reports/${DASHBOARD_PROJECT}/${DASHBOARD_VERSION}?module=web-lib" \
            -H 'Content-Type: application/json' \
            -H "X-Api-Key: ${STRYKER_DASHBOARD_API_KEY}" \
            --data-binary @web/reports/mutation/mutation.json > /dev/null; then
            echo "Stryker Dashboard report published for ${DASHBOARD_PROJECT} (${DASHBOARD_VERSION}, module web-lib)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Stryker Dashboard publish failed (the score check is unaffected)."
            echo "Stryker Dashboard publish failed (the score check is unaffected)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Writes the score table and mutation-score.json, then checks the committed minimum. It runs after the dashboard
      # step so a score below the floor cannot stop the publish, and before the upload so the score file is attached.
      - name: Report the mutation score and check the committed minimum
        if: ${{ !cancelled() }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          KEY_PRESENT: ${{ steps.key.outputs.present }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          args=()
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "Stryker Dashboard publish not attempted: pull request validation runs never publish." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${KEY_PRESENT}" != "true" ]; then
            args+=(--dashboard-skipped)
          fi
          node web/scripts/mutation-ratchet.mjs \
            --project web-lib \
            --report web/reports/mutation/mutation.json \
            --output-directory mutation-out \
            --run-id "${RUN_ID}" \
            --commit "${COMMIT_SHA}" \
            "${args[@]}"

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-web-lib
          path: |
            web/reports/mutation/
            mutation-out/
          if-no-files-found: warn
          retention-days: 14

      - name: Explain a time budget stop
        if: ${{ cancelled() }}
        run: |
          echo "The job was cancelled or hit its time budget. To cut scope, see specs/011-test-quality-reporting/research.md D4 (Budget and scope cut)." >> "$GITHUB_STEP_SUMMARY"

  # ---- Stack jobs that feed the combined Allure report (story 2b). Fictional data only. ------------------------------

  # The nightly adds the Integration lane (needs Docker), which the ordinary CI report leaves out to save time.
  tests-dotnet:
    name: xUnit lanes (JUnit for the report)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore and build
        run: |
          dotnet restore RoleRadar.sln --locked-mode
          dotnet build RoleRadar.sln -c Release --no-restore -warnaserror

      # Native xUnit v3 JUnit output, one file per project. A failing test keeps its exit code (the job fails) and the
      # JUnit files are still uploaded so the report shows the failure.
      - name: Run the lanes with JUnit output
        shell: bash
        run: |
          mkdir -p allure-input/dotnet
          worst=0
          for project in Unit Architecture Contract; do
            rc=0
            "tests/RoleRadar.Tests.${project}/bin/Release/net10.0/RoleRadar.Tests.${project}" -junit "allure-input/dotnet/${project}.xml" || rc=$?
            if [ "${rc}" -gt "${worst}" ]; then worst="${rc}"; fi
          done
          # The Integration lane skips the image, web-container and real-stack lanes, which have their own jobs.
          rc=0
          tests/RoleRadar.Tests.Integration/bin/Release/net10.0/RoleRadar.Tests.Integration \
            -trait- Lane=scan -trait- Lane=web-container -trait- Lane=real-stack \
            -junit allure-input/dotnet/Integration.xml || rc=$?
          if [ "${rc}" -gt "${worst}" ]; then worst="${rc}"; fi
          exit "${worst}"

      - name: Upload JUnit results for the combined report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-in-dotnet
          path: allure-input/dotnet/
          if-no-files-found: ignore
          retention-days: 14

  tests-vitest:
    name: Vitest (Allure results)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tests/architecture/token-leakage.test.ts drives real Chromium, so this job needs the browser like the CI web job
      # does (same step, same flags; no browser cache is used there either).
      - name: Install Playwright Chromium with dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run the Vitest suite
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-input/vitest
        run: pnpm --filter web run test

      - name: Upload Vitest results for the combined report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-in-vitest
          path: allure-input/vitest/
          if-no-files-found: ignore
          retention-days: 14

  tests-playwright:
    name: Playwright e2e (Allure results)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: |
          dotnet restore RoleRadar.sln --locked-mode
          pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build web app (the e2e server imports build/server)
        run: pnpm --filter web run build

      - name: Run the e2e suite (fictional-data project only)
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-input/playwright
        run: pnpm --filter web exec playwright test --project=chromium

      - name: Upload Playwright results for the combined report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-in-playwright
          path: allure-input/playwright/
          if-no-files-found: ignore
          retention-days: 14

  # Flake detection (FR-026): the whole fictional-data e2e suite five times over. Ordinary CI keeps one retry; the
  # repeated results go into the same combined report, where a test with mixed outcomes shows as flaky.
  e2e-repeat:
    name: Playwright e2e repeated five times (flake detection)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: |
          dotnet restore RoleRadar.sln --locked-mode
          pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build web app (the e2e server imports build/server)
        run: pnpm --filter web run build

      - name: Run the e2e suite five times
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-input/playwright-repeat
        run: pnpm --filter web exec playwright test --project=chromium --repeat-each=5

      - name: Upload the repeated results for the combined report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-in-playwright-repeat
          path: allure-input/playwright-repeat/
          if-no-files-found: ignore
          retention-days: 14

  # The final job always runs and builds one combined report from whatever the jobs above produced, so a failed stack
  # still yields a report. It runs no tests. Inputs are sanitized and leak-checked before and after generating. On the
  # pull request validation path the report is an artifact only; nothing is published from a pull request.
  allure-report:
    name: Allure combined report
    needs: [tests-dotnet, tests-vitest, tests-playwright, e2e-repeat]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the results of every stack job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-in-*
          path: allure-input

      - name: Sanitize and merge the results
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p allure-merged
          count=0
          for dir in allure-input/allure-in-*; do
            [ -d "$dir" ] || continue
            name="${dir##*/allure-in-}"
            node web/scripts/allure-sanitize.mjs --input "$dir" --output "allure-sanitized/$name" --lane fictional
            cp -r "allure-sanitized/$name"/. allure-merged/
            count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No Allure inputs: no stack job produced results, so there is no combined report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the merged results for absolute paths, user names and host names
        if: steps.merge.outputs.count != '0'
        run: node web/scripts/allure-sanitize.mjs --check allure-merged

      # History is one file, allure-history/history.jsonl, in the gh-pages tree (web/allurerc.mjs explains the cap). It is
      # read from the branch when it exists; a missing branch or file just starts a new history.
      - name: Restore Allure history from gh-pages
        if: steps.merge.outputs.count != '0'
        shell: bash
        run: |
          mkdir -p allure-history
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1 \
            && git fetch --quiet --depth 1 origin gh-pages \
            && git cat-file -e FETCH_HEAD:allure-history/history.jsonl 2> /dev/null; then
            git show FETCH_HEAD:allure-history/history.jsonl > allure-history/history.jsonl
            echo "Restored $(wc -l < allure-history/history.jsonl) Allure history run(s) from gh-pages."
          else
            echo "No Allure history on gh-pages yet; this run starts it."
          fi

      - name: Generate the combined report
        if: steps.merge.outputs.count != '0'
        env:
          ALLURE_REPORT_DIR: ${{ github.workspace }}/allure-report
          ALLURE_HISTORY_PATH: ${{ github.workspace }}/allure-history/history.jsonl
        run: pnpm --filter web exec allure generate "${GITHUB_WORKSPACE}/allure-merged" --clean

      # Sources that must be present: every one whose stack job succeeded.
      - name: Check that no required source is missing from the report
        if: steps.merge.outputs.count != '0'
        shell: bash
        env:
          DOTNET_RESULT: ${{ needs.tests-dotnet.result }}
          VITEST_RESULT: ${{ needs.tests-vitest.result }}
          PLAYWRIGHT_RESULT: ${{ needs.tests-playwright.result }}
        run: |
          required=()
          if [ "$DOTNET_RESULT" = "success" ]; then required+=(Unit Architecture Contract Integration); fi
          if [ "$VITEST_RESULT" = "success" ]; then required+=(Vitest); fi
          if [ "$PLAYWRIGHT_RESULT" = "success" ]; then required+=(Playwright); fi
          if [ "${#required[@]}" -eq 0 ]; then
            echo "No stack job succeeded, so no source is required to be present." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          list=$(IFS=,; echo "${required[*]}")
          node web/scripts/check-combined-report.mjs --results-directory allure-merged --required "$list" --report-directory allure-report

      - name: Check the generated report for absolute paths, user names and host names
        if: steps.merge.outputs.count != '0'
        run: node web/scripts/allure-sanitize.mjs --check allure-report

      - name: Upload the combined report
        if: steps.merge.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      # The updated history travels to the publish job as a one-day artifact; a pull request never writes it anywhere.
      - name: Upload the updated Allure history
        if: steps.merge.outputs.count != '0' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-history
          path: allure-history/history.jsonl
          retention-days: 1

  # Publishes the combined report to the gh-pages branch with peaceiris/actions-gh-pages: the current tree is checked
  # out, allure/ and allure-history/ are replaced in a copy, and the copy is deployed as one orphan commit. Schedule and
  # manual dispatch only: the guard is exactly "not a pull request", so no pull request path reaches this write
  # permission. Pushing works whether or not GitHub Pages is enabled.
  publish-allure:
    name: Publish the Allure report
    needs: [allure-report]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      # Needed only for pages/index.html (the landing page staged at the site root) and the site size script.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            pages
            web/scripts

      - name: Check whether the gh-pages branch exists
        id: pages
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${REPOSITORY}.git" gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the current gh-pages tree
        if: steps.pages.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages-work
          persist-credentials: false

      - name: Download the combined Allure report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-report
          path: publish-input/allure

      - name: Download the updated Allure history
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-history
          path: publish-input/allure-history

      # The deploy replaces the branch with one commit holding exactly site/, so everything already published (the trends
      # page, metrics, badge and coverage report from the main CI publish) is carried over first, then the Allure report
      # and its history are replaced.
      - name: Stage the site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if [ -d pages-work ]; then
            cp -a pages-work/. site/
            rm -rf site/.git
          fi
          mkdir -p site/allure-history
          cp pages/index.html site/index.html
          rm -rf site/allure
          cp -r publish-input/allure site/allure
          cp publish-input/allure-history/history.jsonl site/allure-history/history.jsonl
          # GitHub rejects a file over 100 MB: bound the history by bytes (oldest runs first), then refuse to publish a tree
          # with any file over 50 MB.
          node web/scripts/site-limits.mjs trim-history site/allure-history/history.jsonl
          node web/scripts/site-limits.mjs check-size site

      - name: Publish the site (the branch is replaced by one commit)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: site
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Publish Allure report (${{ github.sha }})

      - name: Say what the owner must enable
        shell: bash
        run: |
          {
            echo "Published the Allure report to the gh-pages branch, which is now one commit."
            echo "The branch is served only when Settings > Pages > Source is set to Deploy from a branch, gh-pages, / (root); pushing works either way."
          } >> "$GITHUB_STEP_SUMMARY"
