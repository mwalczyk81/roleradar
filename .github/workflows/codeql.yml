name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b56ba49e26e50535fa1e7f7db0f4f6b4bf65d90d # v3.28.10
        with:
          languages: csharp
          build-mode: manual

      - name: Build solution for CodeQL
        run: |
          dotnet restore RoleRadar.sln --locked-mode
          dotnet build RoleRadar.sln -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b56ba49e26e50535fa1e7f7db0f4f6b4bf65d90d # v3.28.10
