name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      images: ${{ steps.filter.outputs.images }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - '.github/workflows/**'
              - '.editorconfig'
              - 'NuGet.Config'
              - '.pre-commit-config.yaml'
              - 'src/**'
              - 'tests/**'
              - 'contracts/**'
              - 'RoleRadar.sln'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'scripts/**'
              - 'README.md'
              - 'docs/api/**'
              - 'specs/007-insights-dashboard/contracts/**'
            web:
              - '.github/workflows/**'
              - '.editorconfig'
              - '.pre-commit-config.yaml'
              - 'web/**'
              - 'contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'nx.json'
              - 'pages/**'
              - 'quality/**'
              # web/tests/tooling/front-door-links.test.ts reads these (and follows their links), so a change to any of
              # them must run the web job; a README-only change used to skip it and leave the test silently stale.
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'CODE_OF_CONDUCT.md'
              - 'SECURITY.md'
              - 'CHANGELOG.md'
              - 'docs/**'
            images:
              - '.github/workflows/**'
              - '.dockerignore'
              - 'Dockerfile'
              - 'deploy/**'
              - 'src/**'
              - 'web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tests/RoleRadar.Tests.Integration/Containers/**'
            contracts:
              - 'contracts/**'

  pre-commit:
    name: Pre-Commit & Action Pins (All Changes)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks (gitleaks, hygiene, markdownlint, zizmor, and forbidden-paths guard)
        env:
          SKIP: roleradar-denylist,no-commit-to-branch
        run: |
          pipx install pre-commit
          pre-commit run --all-files --show-diff-on-failure
          git diff --exit-code -- tests/fixtures

      - name: Verify workflow action SHA pins exist on GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-action-pins.ps1

      - name: Setup Node.js for the mutation minimum check
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Mutation minimums may only rise (compared with the base branch)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          node web/scripts/mutation-ratchet.mjs --base-ref "origin/${BASE_REF}"

      - name: Verify OpenAPI contract has zero drift
        run: git diff --exit-code -- contracts

  windows-verify:
    name: Windows (Unit, Architecture & PSScriptAnalyzer)
    runs-on: windows-latest
    needs: [changes]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Run PSScriptAnalyzer on scripts/*.ps1
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings scripts/psscriptanalyzer-settings.psd1 -EnableExit

      - name: Restore with locked dependencies
        run: dotnet restore RoleRadar.sln --locked-mode

      - name: Verify formatting
        run: dotnet format RoleRadar.sln --verify-no-changes

      - name: Build solution
        run: dotnet build RoleRadar.sln -c Release --no-restore -warnaserror

      - name: Verify OpenAPI contract has zero drift
        run: git diff --exit-code -- contracts

      - name: Run Unit and Architecture tests
        env:
          SKIP: roleradar-denylist,no-commit-to-branch
        run: |
          dotnet test tests/RoleRadar.Tests.Unit/RoleRadar.Tests.Unit.csproj -c Release --no-build
          dotnet test tests/RoleRadar.Tests.Architecture/RoleRadar.Tests.Architecture.csproj -c Release --no-build

      - name: Run Pester script portability tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq '5.9.1')) {
              Install-Module -Name Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 5.9.1
          Invoke-Pester -Path tests/RoleRadar.Tests.Unit/Scripts/ScriptPortability.Tests.ps1, tests/RoleRadar.Tests.Unit/Scripts/DenylistCheckModes.Tests.ps1 -CI

  macos-verify:
    name: macOS (Unit, Architecture & Script Portability)
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore with locked dependencies
        run: dotnet restore RoleRadar.sln --locked-mode

      - name: Verify formatting
        run: dotnet format RoleRadar.sln --verify-no-changes

      - name: Build solution
        run: dotnet build RoleRadar.sln -c Release --no-restore -warnaserror

      - name: Verify OpenAPI contract has zero drift
        run: git diff --exit-code -- contracts

      - name: Run Unit and Architecture tests
        run: |
          dotnet test tests/RoleRadar.Tests.Unit/RoleRadar.Tests.Unit.csproj -c Release --no-build
          dotnet test tests/RoleRadar.Tests.Architecture/RoleRadar.Tests.Architecture.csproj -c Release --no-build

      - name: Run Pester script portability tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq '5.9.1')) {
              Install-Module -Name Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 5.9.1
          Invoke-Pester -Path tests/RoleRadar.Tests.Unit/Scripts/ScriptPortability.Tests.ps1 -CI

  ubuntu-build-and-test:
    name: Ubuntu (Build, Testcontainers & Container Security)
    # ubuntu-latest recently moved to 26.04 where Testcontainers MongoDB fails ("mongosh or mongo binary could not be found"); pinned to 24.04
    runs-on: ubuntu-24.04
    needs: [changes]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.images == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore with locked dependencies
        run: dotnet restore RoleRadar.sln --locked-mode

      - name: Verify formatting
        run: dotnet format RoleRadar.sln --verify-no-changes

      - name: Build solution
        run: dotnet build RoleRadar.sln -c Release --no-restore -warnaserror

      - name: Run DockerIgnore coverage unit tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.images == 'true'
        run: dotnet test tests/RoleRadar.Tests.Unit -c Release --no-build --filter "FullyQualifiedName~DockerIgnoreCoverageTests"

      - name: Verify OpenAPI and TypeScript client contract have zero drift
        run: |
          git diff --exit-code -- contracts
          npx --yes openapi-typescript@7.10.1 contracts/openapi/roleradar-api.json -o contracts/client/api-types.ts
          git diff --exit-code -- contracts

      - name: Run Database Tools update check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-tools-release.ps1

      - name: Record dev stack safety canary baseline
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-devstack-canary.ps1 -Action Record

      - name: Run full test suite (Unit, Architecture, Contract, Integration) with Coverage
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
        run: dotnet test RoleRadar.sln -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx" --results-directory ./TestResults --filter "Lane!=scan&Lane!=web-container&Lane!=real-stack"

      - name: Verify dev stack safety canary remains untouched
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-devstack-canary.ps1 -Action Verify

      # Native xUnit v3 JUnit output for the combined Allure report (path C, no csproj change). The fast lanes only:
      # Integration needs Docker and runs in the nightly workflow, which adds it to the report. The main test run above
      # is still what gates the build; this run only feeds the report.
      - name: Write JUnit results for the combined report (Unit, Architecture, Contract)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
        shell: bash
        run: |
          mkdir -p allure-input/dotnet
          worst=0
          for project in Unit Architecture Contract; do
            rc=0
            "tests/RoleRadar.Tests.${project}/bin/Release/net10.0/RoleRadar.Tests.${project}" -junit "allure-input/dotnet/${project}.xml" || rc=$?
            if [ "${rc}" -gt "${worst}" ]; then worst="${rc}"; fi
          done
          exit "${worst}"

      - name: Upload JUnit results for the combined report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-in-dotnet
          path: allure-input/dotnet/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify >=85% line coverage across RoleRadar.Domain and RoleRadar.Application
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          dotnet tool restore
          dotnet tool run reportgenerator `
            "-reports:TestResults/**/coverage.cobertura.xml" `
            "-targetdir:TestResults/merged" `
            "-reporttypes:Cobertura;MarkdownSummaryGithub;Html;Badges;JsonSummary" `
            "-assemblyfilters:+RoleRadar.Domain;+RoleRadar.Application" `
            "-filefilters:-*.g.cs"

          $mergedXmlPath = "TestResults/merged/Cobertura.xml"
          if (-not (Test-Path -LiteralPath $mergedXmlPath)) {
              throw "Merged Cobertura report not found at '$mergedXmlPath'."
          }

          [xml]$merged = Get-Content -LiteralPath $mergedXmlPath
          $root = $merged.DocumentElement
          $rawLineRate = $root.GetAttribute('line-rate')
          $covered = $root.GetAttribute('lines-covered')
          $valid = $root.GetAttribute('lines-valid')

          $lineRate = [double]::Parse($rawLineRate, [System.Globalization.CultureInfo]::InvariantCulture)
          $pct = [math]::Round($lineRate * 100.0, 2)
          Write-Output "Merged Domain + Application Line Coverage: $pct% ($covered / $valid)"

          $summaryMdPath = "TestResults/merged/SummaryGithub.md"
          if (Test-Path -LiteralPath $summaryMdPath) {
              if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
                  Get-Content -LiteralPath $summaryMdPath -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              }
          }

          if ($pct -lt 85.0) {
              throw "Merged line coverage $pct% is below the mandatory 85.0% threshold."
          }

      # The HTML report and the badge SVGs are generated from this run's coverage; nothing is committed. 14 days is enough
      # to open the report from a pull request. The metrics-and-pages job downloads this artifact on main only.
      - name: Upload coverage report (HTML and badges)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: TestResults/merged/
          if-no-files-found: warn
          retention-days: 14

      - name: Lint Dockerfiles with hadolint
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true'
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 hadolint - < Dockerfile
          docker run --rm -i hadolint/hadolint:v2.12.0 hadolint - < deploy/Dockerfile.identity
          docker run --rm -i hadolint/hadolint:v2.12.0 hadolint - < deploy/Dockerfile.api
          docker run --rm -i hadolint/hadolint:v2.12.0 hadolint - < deploy/Dockerfile.web

      - name: Build local container images (never pushed/published per ADR-0016)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true'
        run: |
          docker build --target cli -t roleradar-cli:local .
          docker build --target mcp -t roleradar-mcp:local .
          docker build -f deploy/Dockerfile.identity -t roleradar-identity:local .
          docker build -f deploy/Dockerfile.api -t roleradar-api:local .
          docker build -f deploy/Dockerfile.web -t roleradar-web:local .

      # On a web-only change (package.json, pnpm-lock.yaml, web/**) the full test suite is skipped, so nothing has created
      # TestResults yet. The Trivy containers below would then create it as root, and the launched-host test could not
      # write its scan report there ("Access ... is denied").
      - name: Create the TestResults directory as the runner user
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true'
        run: mkdir -p TestResults

      - name: Run Trivy vulnerability scan on container images
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/TestResults:/TestResults aquasec/trivy:0.59.1 image --list-all-pkgs --severity CRITICAL --exit-code 1 --ignore-unfixed --format json --output /TestResults/trivy-report-cli.json roleradar-cli:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/TestResults:/TestResults aquasec/trivy:0.59.1 image --list-all-pkgs --severity CRITICAL --exit-code 1 --ignore-unfixed --format json --output /TestResults/trivy-report-mcp.json roleradar-mcp:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/TestResults:/TestResults aquasec/trivy:0.59.1 image --list-all-pkgs --severity CRITICAL --exit-code 1 --ignore-unfixed --format json --output /TestResults/trivy-report-identity.json roleradar-identity:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/TestResults:/TestResults aquasec/trivy:0.59.1 image --list-all-pkgs --severity CRITICAL --exit-code 1 --ignore-unfixed --format json --output /TestResults/trivy-report-api.json roleradar-api:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/TestResults:/TestResults aquasec/trivy:0.59.1 image --list-all-pkgs --severity CRITICAL --exit-code 1 --ignore-unfixed --format json --output /TestResults/trivy-report-web.json roleradar-web:local

      - name: Generate CycloneDX SBOMs for container images
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/TestResults:/TestResults aquasec/trivy:0.59.1 image --format cyclonedx --output /TestResults/sbom-cli.json roleradar-cli:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/TestResults:/TestResults aquasec/trivy:0.59.1 image --format cyclonedx --output /TestResults/sbom-mcp.json roleradar-mcp:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/TestResults:/TestResults aquasec/trivy:0.59.1 image --format cyclonedx --output /TestResults/sbom-identity.json roleradar-identity:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/TestResults:/TestResults aquasec/trivy:0.59.1 image --format cyclonedx --output /TestResults/sbom-api.json roleradar-api:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/TestResults:/TestResults aquasec/trivy:0.59.1 image --format cyclonedx --output /TestResults/sbom-web.json roleradar-web:local

      - name: Upload Security Reports and SBOMs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-artifacts
          path: |
            TestResults/trivy-report-*.json
            TestResults/sbom-*.json
            TestResults/database-capability-matrix.*

      # The scan test reads the reports Trivy just wrote; it has its own lane because it cannot run before them. CI is set,
      # so a missing or invalid report fails the step (it never writes a report of its own).
      - name: Verify the container scan reports (scan lane)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true'
        run: dotnet test tests/RoleRadar.Tests.Integration/RoleRadar.Tests.Integration.csproj -c Release --no-build --filter "Lane=scan"

      - name: Run launched-host test suites against container images
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test-images.ps1 -CliImage roleradar-cli:local -McpImage roleradar-mcp:local -IdentityImage roleradar-identity:local -WebImage roleradar-web:local -NoBuild

      # Test counts per lane (TRX) and coverage (ReportGenerator's Summary.json), read from this run's own outputs by
      # web/scripts/metrics-record.mjs. A missing input shows as "unavailable" and fails the step. Image sizes and scan
      # counts are not part of this summary; the local review gate prints them.
      - name: Setup Node.js for the run summary
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Run summary
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
        run: node web/scripts/metrics-record.mjs summary --trx-directory TestResults --coverage-summary TestResults/merged/Summary.json --json-output TestResults/run-summary.json

      # The normalized numbers (test counts per lane, coverage per project) feed the metrics record on main. They are
      # small, so 14 days of retention costs nothing.
      - name: Upload run summary numbers
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-summary
          path: TestResults/run-summary.json
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web (Build, Lint & Test)
    runs-on: ubuntu-24.04
    needs: [changes]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive SHAs for Nx affected
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: |
          dotnet restore RoleRadar.sln --locked-mode
          pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build web app (the e2e server imports build/server)
        run: pnpm --filter web run build

      - name: Run E2E tests
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-input/playwright
        run: pnpm run test:e2e

      # Failure evidence only: Playwright writes a screenshot (only-on-failure) and a trace (retain-on-failure) under
      # web/test-results, and CI writes the HTML report to web/playwright-report. Nothing is uploaded on a green run.
      # This job uses fictional data only, so 14 days is enough to open a failed pull request run. The real-stack job
      # below keeps 7 days because its traces can show real-looking sessions, and none of this reaches the published site.
      - name: Upload e2e failure artifacts (screenshots, traces, HTML report)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-failure
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run web coverage gate (>=80% lines, >=75% branches)
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-input/vitest
        run: pnpm run test:coverage

      - name: Run Nx affected (typecheck, lint)
        run: pnpm exec nx affected -t typecheck lint --exclude="RoleRadar.*"

      # Allure results from the Vitest and Playwright runs above (fictional data only, so attachments stay; the final
      # allure-report job sanitizes them before anything is published).
      - name: Upload Vitest results for the combined report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-in-vitest
          path: allure-input/vitest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright results for the combined report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-in-playwright
          path: allure-input/playwright/
          if-no-files-found: ignore
          retention-days: 14

  e2e-real-stack:
    name: Real-Stack E2E (Identity, API, Web, Mongo)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.images == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: |
          dotnet restore RoleRadar.sln --locked-mode
          pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build local container images
        run: |
          docker build -f deploy/Dockerfile.identity -t roleradar-identity:local .
          docker build -f deploy/Dockerfile.api -t roleradar-api:local .
          docker build -f deploy/Dockerfile.web -t roleradar-web:local .

      - name: Run Real-Stack Playwright E2E Suite
        shell: pwsh
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-input/real-stack
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test-e2e-real.ps1 -NoBuild

      # Real-stack results leave this job only after the sanitizer has removed every attachment (nested ones too) and
      # every absolute path, user name and host name: pass or fail, names and timings only. The raw results, with their
      # traces, are never uploaded here (traces exist only in the 7-day failure artifact below).
      - name: Sanitize real-stack results (pass or fail and timings only)
        if: always()
        shell: bash
        run: |
          if [ -d allure-input/real-stack ]; then
            node web/scripts/allure-sanitize.mjs --input allure-input/real-stack --output allure-sanitized/real-stack --lane real-stack
          fi

      - name: Upload sanitized real-stack results for the combined report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-in-real-stack
          path: allure-sanitized/real-stack/
          if-no-files-found: ignore
          retention-days: 7

      # Failure evidence only, kept 7 days (shorter than the 14 days of the fictional-data e2e job above): traces from
      # this job can show real-looking sessions. Never uploaded on success, never downloaded by the publish job.
      - name: Upload real-stack failure artifacts (screenshots, traces, HTML report)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-stack-e2e-failure
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # One combined Allure report per run, built by a final job that always runs, from the results the stack jobs above
  # already produced (xUnit JUnit, Vitest, Playwright, real-stack). It runs no tests. Everything is sanitized first
  # (scripts/allure-sanitize.mjs) and leak-checked before and after generating. On pull requests the report is an
  # artifact only; on main it is handed to the publish job. It does not run for fork pull requests. A stack that failed
  # is not required to be complete (a failed run still gets a report); a stack that succeeded must be, or this job fails.
  allure-report:
    name: Allure combined report
    runs-on: ubuntu-24.04
    needs: [changes, ubuntu-build-and-test, web, e2e-real-stack]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the results of every stack job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-in-*
          path: allure-input

      - name: Sanitize and merge the results
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p allure-merged
          count=0
          for dir in allure-input/allure-in-*; do
            [ -d "$dir" ] || continue
            name="${dir##*/allure-in-}"
            lane=fictional
            if [ "$name" = "real-stack" ]; then lane=real-stack; fi
            node web/scripts/allure-sanitize.mjs --input "$dir" --output "allure-sanitized/$name" --lane "$lane"
            cp -r "allure-sanitized/$name"/. allure-merged/
            count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No Allure inputs: no stack job produced results, so there is no combined report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the merged results for absolute paths, user names and host names
        if: steps.merge.outputs.count != '0'
        run: node web/scripts/allure-sanitize.mjs --check allure-merged

      # History is one file, allure-history/history.jsonl, in the gh-pages tree (web/allurerc.mjs explains the cap). It is
      # read from the branch when it exists; a missing branch or file just starts a new history. Only the publish job
      # on main writes it back.
      - name: Restore Allure history from gh-pages
        if: steps.merge.outputs.count != '0'
        shell: bash
        run: |
          mkdir -p allure-history
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1 \
            && git fetch --quiet --depth 1 origin gh-pages \
            && git cat-file -e FETCH_HEAD:allure-history/history.jsonl 2> /dev/null; then
            git show FETCH_HEAD:allure-history/history.jsonl > allure-history/history.jsonl
            echo "Restored $(wc -l < allure-history/history.jsonl) Allure history run(s) from gh-pages."
          else
            echo "No Allure history on gh-pages yet; this run starts it."
          fi

      - name: Generate the combined report
        if: steps.merge.outputs.count != '0'
        env:
          ALLURE_REPORT_DIR: ${{ github.workspace }}/allure-report
          ALLURE_HISTORY_PATH: ${{ github.workspace }}/allure-history/history.jsonl
        run: pnpm --filter web exec allure generate "${GITHUB_WORKSPACE}/allure-merged" --clean

      # Which sources must be present: those whose stack job succeeded and actually ran.
      - name: Check that no required source is missing from the report
        if: steps.merge.outputs.count != '0'
        shell: bash
        env:
          UBUNTU_RESULT: ${{ needs.ubuntu-build-and-test.result }}
          WEB_RESULT: ${{ needs.web.result }}
          BACKEND_RAN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
          WEB_RAN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' }}
        run: |
          required=()
          if [ "$UBUNTU_RESULT" = "success" ] && [ "$BACKEND_RAN" = "true" ]; then required+=(Unit Architecture Contract); fi
          if [ "$WEB_RESULT" = "success" ] && [ "$WEB_RAN" = "true" ]; then required+=(Vitest Playwright); fi
          if [ "${#required[@]}" -eq 0 ]; then
            echo "No stack job both succeeded and ran, so no source is required to be present." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          list=$(IFS=,; echo "${required[*]}")
          node web/scripts/check-combined-report.mjs --results-directory allure-merged --required "$list" --report-directory allure-report

      - name: Check the generated report for absolute paths, user names and host names
        if: steps.merge.outputs.count != '0'
        run: node web/scripts/allure-sanitize.mjs --check allure-report

      - name: Upload the combined report
        if: steps.merge.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      # The updated history travels to the publish job as a one-day artifact; only main ever writes it to gh-pages.
      - name: Upload the updated Allure history
        if: steps.merge.outputs.count != '0' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-history
          path: allure-history/history.jsonl
          retention-days: 1

  # Metrics history, coverage report and badge, the trends page and the combined Allure report, published to the gh-pages
  # branch. This is the only job here with write access, and it never runs on a pull request or a fork: the condition is
  # a push to main whose backend tests ran and whose gate passed. It publishes numbers read from this run's own outputs
  # (run-summary artifact, the job list of this run, the latest nightly mutation score with its own run date and commit).
  # The current gh-pages tree is checked out first (when the branch exists), the whole site is assembled in site/ from it
  # and this run's outputs, and peaceiris/actions-gh-pages publishes site/ as one orphan commit. Pushing to the branch
  # works whether or not GitHub Pages is enabled; the job summary says what to enable.
  metrics-and-pages:
    name: Publish metrics, coverage and trends (main only)
    runs-on: ubuntu-24.04
    needs: [changes, ubuntu-build-and-test, ci-gate, allure-report]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success' && needs.changes.outputs.backend == 'true'
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Check whether the gh-pages branch exists
        id: pages
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the current gh-pages tree
        if: steps.pages.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages-work
          persist-credentials: false

      - name: Download the run summary numbers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: run-summary
          path: publish-input

      - name: Download the coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: publish-input/coverage

      # The combined report and its history are optional: a run in which no stack produced results has neither, and
      # nothing is published for them.
      - name: Download the combined Allure report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-report
          path: publish-input/allure

      - name: Download the updated Allure history
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-history
          path: publish-input/allure-history

      # The whole site is assembled in site/ on every run, because the deploy below replaces the branch with one commit:
      # whatever is not in site/ is gone afterwards. Everything already on gh-pages is carried over first (so a run that has
      # no new Allure report keeps the old one), then the parts this run regenerates are replaced: the trends page, the
      # badge, the coverage report, the Allure report and its history. metrics.jsonl is appended in the next step.
      - name: Stage the site
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if [ -d pages-work ]; then
            cp -a pages-work/. site/
            rm -rf site/.git
          fi
          mkdir -p site/metrics site/badges site/allure-history
          cp pages/index.html site/index.html
          cp -r pages/metrics/. site/metrics/
          rm -rf site/coverage
          cp -r publish-input/coverage site/coverage
          badge=$(find site/coverage -name badge_linecoverage.svg | head -n 1)
          if [ -z "${badge}" ]; then
            echo "badge_linecoverage.svg is missing from the coverage report; nothing is published." >&2
            exit 1
          fi
          cp "${badge}" site/badges/coverage.svg
          if [ -f publish-input/allure/index.html ]; then
            rm -rf site/allure
            cp -r publish-input/allure site/allure
          fi
          if [ -f publish-input/allure-history/history.jsonl ]; then
            cp publish-input/allure-history/history.jsonl site/allure-history/history.jsonl
          fi
          # GitHub rejects a file over 100 MB: bound the history by bytes (oldest runs first), then refuse to publish a tree
          # with any file over 50 MB.
          node web/scripts/site-limits.mjs trim-history site/allure-history/history.jsonl
          node web/scripts/site-limits.mjs check-size site

      # Appends this run's record to the existing metrics.jsonl (from the gh-pages checkout, so nothing is lost) and writes
      # the whole file into the site. Job durations come from the run's own job list (completed jobs only; this job is
      # still running and is left out). The mutation score is the latest successful nightly's, with its own run date and
      # commit; it is absent until one exists.
      - name: Build the metrics record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh run view "${RUN_ID}" --repo "${REPOSITORY}" --json jobs > publish-input/jobs.json
          mutation_args=()
          nightly_id=$(gh run list --repo "${REPOSITORY}" --workflow nightly-quality.yml --status success --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2> /dev/null || true)
          if [ -n "${nightly_id}" ] && gh run download "${nightly_id}" --repo "${REPOSITORY}" --name mutation-web-lib --dir publish-input/nightly 2> /dev/null; then
            score_file=$(find publish-input/nightly -name mutation-score.json | head -n 1)
            if [ -n "${score_file}" ]; then mutation_args=(--mutation "${score_file}"); fi
          fi
          node web/scripts/metrics-record.mjs record \
            --commit "${COMMIT_SHA}" \
            --summary publish-input/run-summary.json \
            --jobs publish-input/jobs.json \
            --existing pages-work/metrics/metrics.jsonl \
            --output site/metrics/metrics.jsonl \
            "${mutation_args[@]}"

      # One deploy. force_orphan makes gh-pages a single new commit holding exactly site/ (the action does not clone the
      # branch in that mode, so keep_files has nothing to keep and is not used) and force-pushes it, so the branch never
      # accumulates history. Nothing is lost: everything worth keeping was carried into site/ above.
      - name: Publish the site (the branch is replaced by one commit)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: site
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Publish reports (${{ github.sha }})

      - name: Say what the owner must enable
        shell: bash
        env:
          BRANCH_EXISTED: ${{ steps.pages.outputs.exists }}
        run: |
          {
            echo "Published to the gh-pages branch, which is now one commit (it $([ "${BRANCH_EXISTED}" = true ] && echo already existed || echo was created by this run))."
            echo "The branch is served only when Settings > Pages > Source is set to Deploy from a branch, gh-pages, / (root); pushing works either way."
          } >> "$GITHUB_STEP_SUMMARY"

  ci-gate:
    name: Ubuntu (Build, Testcontainers, >=85% Coverage & Pre-Commit)
    runs-on: ubuntu-24.04
    if: always()
    needs: [changes, pre-commit, ubuntu-build-and-test, web, windows-verify, e2e-real-stack, allure-report]
    steps:
      - name: Verify status of all workflow jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          UBUNTU_RESULT: ${{ needs.ubuntu-build-and-test.result }}
          WEB_RESULT: ${{ needs.web.result }}
          WINDOWS_RESULT: ${{ needs.windows-verify.result }}
          E2E_RESULT: ${{ needs.e2e-real-stack.result }}
          ALLURE_RESULT: ${{ needs.allure-report.result }}
        run: |
          echo "Evaluating CI job results:"
          echo "  changes:               $CHANGES_RESULT"
          echo "  pre-commit:            $PRE_COMMIT_RESULT"
          echo "  ubuntu-build-and-test: $UBUNTU_RESULT"
          echo "  web:                   $WEB_RESULT"
          echo "  windows-verify:        $WINDOWS_RESULT"
          echo "  e2e-real-stack:        $E2E_RESULT"
          echo "  allure-report:         $ALLURE_RESULT"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Error: The 'changes' job did not succeed (result: $CHANGES_RESULT)."
            exit 1
          fi

          for result in "$CHANGES_RESULT" "$PRE_COMMIT_RESULT" "$UBUNTU_RESULT" "$WEB_RESULT" "$WINDOWS_RESULT" "$E2E_RESULT" "$ALLURE_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Error: One or more required CI jobs did not succeed or skip (encountered: $result)."
              exit 1
            fi
          done

          echo "All required CI jobs succeeded or were cleanly skipped."

  # One sticky comment on the pull request with the numbers of this run: tests per lane and coverage (from the run-summary
  # artifact only), the latest nightly mutation score when there is one, and links to the run, its artifacts and the Pages
  # report. The body is built by web/scripts/metrics-record.mjs comment from aggregate numbers; no result file is read, so
  # nothing from the real-stack lane can reach it (web/tests/support/workflow-privacy.ts binds this). Only this job holds
  # pull-requests: write. It never fails the run: when it may not or cannot comment it says so in the job summary.
  pr-report:
    name: Pull request report
    runs-on: ubuntu-24.04
    needs: [changes, ubuntu-build-and-test, web, allure-report, ci-gate]
    if: always() && github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Decide whether this run may comment
        id: gate
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "${HEAD_REPO}" != "${REPOSITORY}" ]; then
            echo "No pull request comment: the pull request comes from a fork, whose token cannot write comments." >> "$GITHUB_STEP_SUMMARY"
            echo "comment=false" >> "$GITHUB_OUTPUT"
          elif [ "${ACTOR}" = "dependabot[bot]" ]; then
            echo "No pull request comment: Dependabot runs get a read-only token." >> "$GITHUB_STEP_SUMMARY"
            echo "comment=false" >> "$GITHUB_OUTPUT"
          else
            echo "comment=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.comment == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.gate.outputs.comment == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Download the run summary numbers
        if: steps.gate.outputs.comment == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: run-summary
          path: report-input

      # The mutation score is the latest successful nightly's, with its own date and commit; absent until one exists.
      - name: Build the comment
        if: steps.gate.outputs.comment == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mutation_args=()
          nightly_id=$(gh run list --repo "${REPOSITORY}" --workflow nightly-quality.yml --status success --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2> /dev/null || true)
          if [ -n "${nightly_id}" ] && gh run download "${nightly_id}" --repo "${REPOSITORY}" --name mutation-web-lib --dir report-input/nightly 2> /dev/null; then
            score_file=$(find report-input/nightly -name mutation-score.json | head -n 1)
            if [ -n "${score_file}" ]; then mutation_args=(--mutation "${score_file}"); fi
          fi
          # The Pages report is linked only when it answers (Pages enabled and a report published from main).
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          pages_url="https://${owner,,}.github.io/${name}/allure/"
          pages_args=()
          if curl -fsI --max-time 10 "${pages_url}index.html" > /dev/null 2>&1; then pages_args=(--pages-url "${pages_url}"); fi
          node web/scripts/metrics-record.mjs comment \
            --summary report-input/run-summary.json \
            --commit "${COMMIT_SHA}" \
            --run-url "${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}" \
            --artifacts-url "${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}#artifacts" \
            --output report-input/comment.md \
            "${pages_args[@]}" \
            "${mutation_args[@]}"

      # --edit-last --create-if-none edits the last comment of the current user (the bot) or creates one. A gh without
      # those flags falls back to finding the comment by its hidden marker.
      - name: Post or update the comment
        if: steps.gate.outputs.comment == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh pr comment --help | grep -q -- '--create-if-none'; then
            gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body-file report-input/comment.md --edit-last --create-if-none
          else
            comment_id=$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- roleradar-ci-report -->"))) | .id' | head -n 1)
            if [ -n "${comment_id}" ]; then
              gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" --field body=@report-input/comment.md > /dev/null
            else
              gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body-file report-input/comment.md
            fi
          fi
          echo "Pull request comment posted or updated." >> "$GITHUB_STEP_SUMMARY"

      - name: Say when the comment could not be posted
        if: failure() && steps.gate.outputs.comment == 'true'
        shell: bash
        run: echo "The pull request comment could not be posted or updated (see the steps above). The run summary and artifacts are unaffected." >> "$GITHUB_STEP_SUMMARY"
