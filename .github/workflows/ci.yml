name: CI

on:
  push:
    branches: [main, "001-*", "feature/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-verify:
    name: Windows (Unit, Architecture & PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Run PSScriptAnalyzer on scripts/*.ps1
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Warning,Error
          if ($results) {
              $results | Format-Table -AutoSize | Out-String | Write-Output
              throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
          Write-Output "PSScriptAnalyzer passed with 0 issues."

      - name: Run privacy path guard
        shell: pwsh
        run: ./scripts/pre-commit.ps1

      - name: Restore with locked dependencies
        run: dotnet restore RoleRadar.sln --locked-mode

      - name: Verify formatting
        run: dotnet format RoleRadar.sln --verify-no-changes

      - name: Build solution
        run: dotnet build RoleRadar.sln -c Release --no-restore -warnaserror

      - name: Run Unit and Architecture tests
        run: |
          dotnet test tests/RoleRadar.Tests.Unit/RoleRadar.Tests.Unit.csproj -c Release --no-build
          dotnet test tests/RoleRadar.Tests.Architecture/RoleRadar.Tests.Architecture.csproj -c Release --no-build

  ubuntu-integration-and-coverage:
    name: Ubuntu (Build, Testcontainers, >=85% Coverage & Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run privacy path guard (no external denylist required in CI)
        shell: pwsh
        run: ./scripts/pre-commit.ps1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore with locked dependencies
        run: dotnet restore RoleRadar.sln --locked-mode

      - name: Verify formatting
        run: dotnet format RoleRadar.sln --verify-no-changes

      - name: Build solution
        run: dotnet build RoleRadar.sln -c Release --no-restore -warnaserror

      - name: Run full test suite (Unit, Architecture, Contract, Integration) with Coverage
        run: dotnet test RoleRadar.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Verify >=85% line coverage across RoleRadar.Domain and RoleRadar.Application
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $coberturaFiles = @(Get-ChildItem -Path ./TestResults -Filter "coverage.cobertura.xml" -Recurse)
          if ($coberturaFiles.Count -eq 0) {
              throw "No coverage.cobertura.xml files were produced."
          }
          $coveredLines = 0
          $validLines = 0
          foreach ($file in $coberturaFiles) {
              [xml]$xml = Get-Content -LiteralPath $file.FullName
              $packages = @($xml.coverage.packages.package | Where-Object { $_.name -in @('RoleRadar.Domain', 'RoleRadar.Application') })
              foreach ($pkg in $packages) {
                  foreach ($cls in @($pkg.classes.class)) {
                      foreach ($line in @($cls.lines.line)) {
                          $validLines++
                          if ([int]$line.hits -gt 0) {
                              $coveredLines++
                          }
                      }
                  }
              }
          }
          if ($validLines -eq 0) {
              throw "Zero instrumentable lines found in RoleRadar.Domain and RoleRadar.Application."
          }
          $pct = [math]::Round(($coveredLines / $validLines) * 100.0, 2)
          Write-Output "Domain + Application Line Coverage: $pct% ($coveredLines / $validLines)"
          if ($pct -lt 85.0) {
              throw "Line coverage $pct% is below the mandatory 85.0% threshold."
          }
