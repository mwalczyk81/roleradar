version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Digest bumps are not minor/patch updates, so a minor/patch group never matches them.
  # Group everything per ecosystem and let CI (image build + smoke test) judge the result.
  # One entry for both directories so the same base image is a single PR, not one per directory.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/deploy"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      # AGENTS.md pins Node 22 (LTS); 25 is not an LTS line. Moving the Node major is a deliberate change with its own PR.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The pre-commit repo tags changed shape (v0.23.3 to 0.24.0), which defeats update-type matching.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit:
        patterns:
          - "*"

  # pnpm workspace: one root pnpm-lock.yaml covers the root package and web/. Dependabot reads it through the npm
  # ecosystem from "/" only. Listing "/web" as well opened every bump twice, and the "/web" copies edited
  # web/package.json without the lockfile, so they could never pass CI.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # The lint, test and build tooling majors move together, so they arrive as one PR instead of one per package.
      npm-tooling-major:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "jsdom"
          - "vite"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
    ignore:
      # Types track the Node 22 runtime (AGENTS.md); 26.x types would describe APIs that do not exist there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 005b stays on React Router v7 (spec FR-001) although 8.x exists; revisit with its own spec.
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-router/*"
        update-types: ["version-update:semver-major"]
