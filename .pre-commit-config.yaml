default_install_hook_types:
  - pre-commit
  - pre-push
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: mixed-line-ending
        exclude: ^tests/fixtures/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: roleradar-path-guard
        name: RoleRadar path, extension, and workflow SHA guard
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit.ps1 -Check PathGuard
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: roleradar-denylist
        name: RoleRadar real-name denylist check
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit.ps1 -Check Denylist
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: roleradar-dotnet-format
        name: Verify C# formatting (dotnet format)
        entry: dotnet format RoleRadar.sln --verify-no-changes
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
