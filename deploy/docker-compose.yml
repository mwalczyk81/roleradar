services:
  mongo:
    image: mongo:8.0.34
    container_name: roleradar-mongo
    restart: unless-stopped
    environment:
      # Work around MongoDB SERVER-121912 rseq/TCMalloc startup abort on Linux kernels 6.19+ and 7.0.0-7.0.13.
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    command: ["mongod", "--replSet", "rs0", "--bind_ip", "127.0.0.1,mongo"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - roleradar-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'try { if (rs.status().ok === 1) quit(0); } catch(e) {} try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"127.0.0.1:27017\" }] }); quit(0); } catch(e) { quit(1); }'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  roleradar-mongo-data:
    name: roleradar-mongo-data
    external: true
